[project]
name = "payledger"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["app*"]
