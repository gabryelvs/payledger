line-length = 100
target-version = "py313"
# Alembic auto-generates these; don't lint generated migration code.
extend-exclude = ["migrations/versions"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.flake8-bugbear]
# FastAPI uses these as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
