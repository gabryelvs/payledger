name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payledger
          POSTGRES_PASSWORD: payledger
          POSTGRES_DB: payledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payledger" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://payledger:payledger@localhost:5432/payledger
