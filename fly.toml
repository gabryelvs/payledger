# Fly.io deployment config for PayLedger.
# Usage:
#   fly launch --no-deploy          # create the app (the live demo is payledger-gv)
#   fly postgres create             # provision Postgres, then `fly postgres attach`
#   fly secrets set JWT_SECRET=...  # set runtime secrets
#   fly deploy                      # build + release (runs migrations, see [deploy])

app = "payledger-gv"
primary_region = "lhr"  # London

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  ACCESS_TTL_MIN = "15"
  REFRESH_TTL_DAYS = "7"
  # The public demo enables demo deposits (default off in code; see README
  # "Demo deposits"). Set it on the app, e.g.:
  #   fly secrets set DEMO_DEPOSITS_ENABLED=true -a payledger-gv
  # or add DEMO_DEPOSITS_ENABLED = "true" here.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  method = "GET"
  path = "/healthz"
